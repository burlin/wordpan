phrase_generation_task:
  description: >
    Create a short phrase (5-15 words) that includes ALL of these words in exact form: {words}

    User context: {user_context}

    Rules: Use every word from the list. Do not skip or replace any word. Each word
    must appear in the phrase exactly as given. Order and grammar can vary.

    Return a JSON object:
    {{
      "phrase": "your phrase with all words included",
      "words": ["word1", "word2", "word3"]
    }}
    The "words" array must list all input words you used (same as the input list).
  expected_output: >
    A JSON object with "phrase" (string) - a short phrase containing ALL input words
    in exact form, and "words" (array) - the full list of input words used.
  agent: phrase_creator
